name: InnSight CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  # ------------------------------------------------------------------
  # Job 1: Pruebas del backend Flask
  # ------------------------------------------------------------------
  backend-test:
    name: Backend - Pruebas unitarias (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas unitarias
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

  # ------------------------------------------------------------------
  # Job 2: Build de imagen Docker
  # ------------------------------------------------------------------
  docker-build:
    name: Docker - Build de imagen
    runs-on: ubuntu-latest
    needs: backend-test

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: innsight-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # Job 3: Build iOS (macOS)
  # ------------------------------------------------------------------
  ios-build:
    name: iOS - Build (Xcode)
    runs-on: macos-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Seleccionar versión de Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Mostrar versión de Xcode
        run: xcodebuild -version

      - name: Resolver dependencias (SPM)
        run: |
          xcodebuild -resolvePackageDependencies \
            -project InnSight.xcodeproj \
            -scheme InnSight

      - name: Compilar app
        run: |
          xcodebuild build \
            -project InnSight.xcodeproj \
            -scheme InnSight \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || xcodebuild build \
            -project InnSight.xcodeproj \
            -scheme InnSight \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO

      - name: Subir reporte de build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ~/Library/Logs/DiagnosticReports/
          retention-days: 5
